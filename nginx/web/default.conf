map $http_x_forwarded_proto $proto_luar {
    default $scheme;
    https   https;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # Gurat dasar keamanan
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-XSS-Protection "0" always;

    # Batas body untuk unggah beberapa foto sekaligus via admin. Foto dari
    # kamera HPmodern bisa 8-10MB per file, jadi 5 foto sudah lebih dari 25m
    # dan akan ditolak. Batas lama 25m membuat seller kehilangan foto tanpa
    # pesan yang bisa dipahami. Aman dinaikkan karena foto langsung dikompres
    # di server, jadi tidak ada file besar yang tersimpan.
    client_max_body_size 120m;

    # Nginx menolak request yang melebihi batas di atas sebelum sampai ke
    # aplikasi, sehingga form admin tidak bisa menampilkan pesannya sendiri.
    # Halaman ini yang menggantikan pesan 413 bawaan yang tidak terbaca.
    error_page 413 /terlalu-besar.html;
    location = /terlalu-besar.html {
        root /usr/share/nginx/html;
        internal;
        default_type "text/html; charset=utf-8";
    }

    # Gzip untuk teks
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/manifest+json;

    # Healthcheck tanpa log
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Aset ber-hash dari build (_astro/) → cache lama (immutable)
    location ~* ^/_astro/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # File statis pilihan (favicon & OG image)
    location = /favicon.png {
        root /usr/share/nginx/html;
        expires 1d;
        try_files $uri =404;
    }
    location = /og-default.png {
        root /usr/share/nginx/html;
        expires 1d;
        try_files $uri =404;
    }

    # Foto produk dari volume bersama (read-only)
    location /foto/ {
        alias /usr/share/nginx/foto/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Semua rute lain → aplikasi node (Astro SSR)
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        # Host harus membawa port, verifikasi Origin (proteksi CSRF bawaan Astro)
        # membandingkan Origin dengan Host. $http_host mempertahankan port; $host tidak.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_luar;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}